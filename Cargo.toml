[workspace]
members = ["crates/core", "crates/media", "crates/worker", "crates/isobmff", "crates/mpegts", "crates/subtitles", "crates/framing", "crates/playback", "crates/capture", "crates/codec-aac", "crates/codec-ac3", "crates/codec-dca", "crates/codec-h264", "crates/codec-hevc", "crates/sim"]
exclude = ["research/spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/triergon/triergon"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1

