[workspace]
members = ["crates/core", "crates/media", "crates/worker", "crates/isobmff", "crates/mpegts", "crates/subtitles", "crates/framing", "crates/playback", "crates/capture", "crates/capture-worker", "crates/pixel", "crates/codec-mpeg1", "crates/codec-aac", "crates/codec-ac3", "crates/codec-dca", "crates/codec-h264", "crates/codec-hevc", "crates/codec", "crates/session", "crates/codec-worker", "crates/harness-protocol", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/triergon/triergon"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# DSP and table code indexes several arrays by one spec-defined loop variable.
needless_range_loop = "allow"
# Hot loops keep their measured slice-chunk forms: as_chunks rewrites changed
# vectorisation (work digest about 8% slower on AAC-heavy Matroska workloads, AC-3/E-AC-3
# decode 0.3-1.4% slower on native Linux ARM64). Adopt per loop with A/B evidence.
chunks_exact_to_as_chunks = "allow"

[profile.release]
lto = "fat"
codegen-units = 1


# Repository tasks hash and unpack large inputs; optimise them even in dev builds.
[profile.dev.package.xtask]
opt-level = 3
