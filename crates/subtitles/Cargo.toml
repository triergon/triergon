[package]
name = "triergon-subtitles"
version = "0.0.0"
repository.workspace = true
license-file = "LICENSE"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-core = { path = "../core" }
triergon-pixel = { path = "../pixel" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }

[features]
# Comparison-only projections that tests compare with recorded reference output;
# not shipped behaviour.
reference-trace = []

[[test]]
name = "pgs_native_projection"
required-features = ["reference-trace"]

[[test]]
name = "text_carriage"
required-features = ["reference-trace"]

[[test]]
name = "text_carriage_native40"
required-features = ["reference-trace"]

[[test]]
name = "text_carriage_retention"
required-features = ["reference-trace"]

[lints]
workspace = true
