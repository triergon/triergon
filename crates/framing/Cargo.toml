[package]
name = "triergon-framing"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-core = { path = "../core" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }

[features]
