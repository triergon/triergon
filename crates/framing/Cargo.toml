[package]
name = "triergon-framing"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-core = { path = "../core" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }

[features]
# Comparison-only projections the harness compares against the reference; not
# shipped behaviour.
reference-trace = []

[[example]]
name = "nal_packet_receiver_trace"
required-features = ["reference-trace"]

[[example]]
name = "dts-operation-trace"
required-features = ["reference-trace"]

[[test]]
name = "dts_operation"
required-features = ["reference-trace"]

[lints]
workspace = true
