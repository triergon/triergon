[package]
name = "codec-worker"
version = "0.0.0"
description = "Decoder measurement workers: decode, letterbox and downmix through the session decoders, and a worker with the AAC decode operations alone"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon = { path = "../triergon", features = ["matroska", "ogg", "elementary"] }
triergon-bitstream = { path = "../bitstream", optional = true }
triergon-codec = { path = "../codec" }
triergon-codec-aac = { path = "../codec-aac" }
triergon-codec-ac3 = { path = "../codec-ac3" }
triergon-codec-dca = { path = "../codec-dca" }
triergon-codec-h264 = { path = "../codec-h264" }
triergon-codec-hevc = { path = "../codec-hevc" }
triergon-codec-opus = { path = "../codec-opus", optional = true }
triergon-core = { path = "../core", optional = true }
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-isobmff = { path = "../isobmff" }
triergon-pixel = { path = "../pixel" }
triergon-session = { path = "../session", features = ["codecs"] }
triergon-worker-entry = { path = "../worker-entry" }

[features]
play = ["triergon/playback", "triergon/codecs", "triergon/render", "triergon/isobmff", "triergon/mpegts"]
# Dependencies needed only by the comparison views binary.
views = ["dep:triergon-bitstream", "dep:triergon-codec-opus", "dep:triergon-core", "triergon/framing", "triergon-codec-h264/inspect"]
# Nightly-only explicit SIMD kernels in the HEVC decoder; output is identical.
hevc-simd = ["triergon-session/hevc-simd"]
# Nightly-only explicit SIMD forms of the AAC decoder's SBR QMF banks; the gate build
# builds `codec-aac-worker` with it.
aac-simd = ["triergon-session/aac-simd"]

[[bin]]
name = "codec-views-worker"
path = "src/bin/codec-views-worker/main.rs"
required-features = ["views"]

[[bin]]
name = "codec-hevc-worker"
path = "src/bin/codec-hevc-worker.rs"
required-features = ["hevc-simd"]

[[bin]]
name = "play-views-worker"
path = "src/bin/play-views-worker/main.rs"
required-features = ["play"]

# The workspace's lints with unsafe_code denied instead of forbidden: the C entry
# point of each worker binary is its one allowed exception (docs/quality.md).
# `cargo xtask check` keeps the rest equal to the workspace's.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
too_many_lines = "allow"
inline_always = "allow"
trivially_copy_pass_by_ref = "allow"
large_types_passed_by_value = "allow"
needless_pass_by_value = "allow"
if_not_else = "allow"
range_plus_one = "allow"
verbose_bit_mask = "allow"
comparison_chain = "allow"
manual_midpoint = "allow"
match_same_arms = "allow"
assert_is_empty = "allow"
wildcard_imports = "allow"
needless_continue = "allow"
format_collect = "allow"
format_push_string = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
struct_field_names = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
