[package]
name = "codec-worker"
version = "0.0.0"
description = "Decoder measurement workers: decode, letterbox and downmix through the session decoders, and a worker with the AAC decode operations alone"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon = { path = "../triergon", features = ["matroska", "ogg", "elementary"] }
triergon-bitstream = { path = "../bitstream", optional = true }
triergon-codec = { path = "../codec" }
triergon-codec-aac = { path = "../codec-aac" }
triergon-codec-ac3 = { path = "../codec-ac3" }
triergon-codec-dca = { path = "../codec-dca" }
triergon-codec-h264 = { path = "../codec-h264" }
triergon-codec-hevc = { path = "../codec-hevc" }
triergon-codec-mpeg1 = { path = "../codec-mpeg1", optional = true }
triergon-codec-opus = { path = "../codec-opus", optional = true }
triergon-core = { path = "../core", optional = true }
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-isobmff = { path = "../isobmff" }
triergon-pixel = { path = "../pixel" }
triergon-session = { path = "../session", features = ["codecs"] }
triergon-worker-entry = { path = "../worker-entry" }

[features]
play = ["triergon/playback", "triergon/codecs", "triergon/render", "triergon/isobmff", "triergon/mpegts"]
# Dependencies needed only by the comparison views binary.
views = ["dep:triergon-bitstream", "dep:triergon-codec-mpeg1", "dep:triergon-codec-opus", "dep:triergon-core", "triergon/codecs", "triergon/framing", "triergon/render", "triergon-codec-h264/inspect"]
# Nightly-only explicit SIMD kernels in the HEVC decoder; output is identical.
hevc-simd = ["triergon-session/hevc-simd"]
# Nightly-only explicit SIMD forms of the AAC decoder's SBR QMF banks; the gate build
# builds `codec-aac-worker` with it.
aac-simd = ["triergon-session/aac-simd"]

[[bin]]
name = "codec-views-worker"
path = "src/bin/codec-views-worker/main.rs"
required-features = ["views"]

[[bin]]
name = "codec-hevc-worker"
path = "src/bin/codec-hevc-worker.rs"
required-features = ["hevc-simd"]

[[bin]]
name = "play-views-worker"
path = "src/bin/play-views-worker/main.rs"
required-features = ["play"]

[lints]
workspace = true
