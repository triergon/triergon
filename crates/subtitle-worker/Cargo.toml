[package]
name = "subtitle-worker"
version = "0.0.0"
description = "Subtitle decode measurement worker: the subtitle operations of harness/reference.c through triergon-subtitles"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-core = { path = "../core" }
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon = { path = "../triergon", features = ["matroska", "isobmff"] }
triergon-mpegts = { path = "../mpegts" }
triergon-subtitles = { path = "../subtitles" }

[lints]
workspace = true
