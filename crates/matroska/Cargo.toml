[package]
name = "triergon-matroska"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-core = { path = "../core" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-worker-entry = { path = "../worker-entry" }

[features]
# Comparison-only projections the harness compares against the reference; not
# shipped behaviour.
reference-trace = []

[[example]]
name = "matroska_views_worker"
required-features = ["reference-trace"]

[lints]
workspace = true
