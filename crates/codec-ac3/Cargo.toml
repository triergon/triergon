[package]
name = "triergon-codec-ac3"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-codec = { path = "../codec" }

[features]
# Bit positions of the syntax elements the dither-stripping and patching tools rewrite;
# comparison tooling only, not shipped behaviour.
reference-trace = []

[[example]]
name = "strip_dither"
required-features = ["reference-trace"]

[[example]]
name = "trace"
required-features = ["reference-trace"]

[lints]
workspace = true
