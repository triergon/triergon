[package]
name = "triergon-isobmff"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
triergon-core = { path = "../core" }
triergon-framing = { path = "../framing" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-worker-entry = { path = "../worker-entry" }

[features]
# Comparison-only projections the harness compares against the reference; not
# shipped behaviour.
reference-trace = []

[[example]]
name = "isobmff_consumer_worker"
required-features = ["reference-trace"]

[[example]]
name = "isobmff_views_worker"
required-features = ["reference-trace"]

[[test]]
name = "integration"

[lints]
workspace = true
