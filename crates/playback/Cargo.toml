[package]
name = "triergon-playback"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-core = { path = "../core" }
triergon-matroska = { path = "../matroska" }
triergon-isobmff = { path = "../isobmff" }
triergon-mpegts = { path = "../mpegts" }

[dev-dependencies]
triergon-bridge = { path = "../bridge" }
triergon-framing = { path = "../framing" }
triergon-raw-video = { path = "../raw-video" }
triergon-subtitles = { path = "../subtitles" }
triergon-session = { path = "../session", features = ["codecs"] }

[features]
# Comparison-only projections the harness compares against the reference; not
# shipped behaviour.
reference-trace = []

[lints]
workspace = true
