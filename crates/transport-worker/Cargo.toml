[package]
name = "transport-worker"
version = "0.0.0"
description = "MPEG-TS packet and access-unit measurement worker"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-core = { path = "../core" }
triergon-framing = { path = "../framing" }
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-mpegts = { path = "../mpegts", features = ["reference-trace"] }
triergon-worker-entry = { path = "../worker-entry" }

[features]
views = []

[[bin]]
name = "transport-views-worker"
path = "src/bin/transport-views-worker/main.rs"
required-features = ["views"]

[lints]
workspace = true
