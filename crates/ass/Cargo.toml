[package]
name = "triergon-ass"
version = "0.0.0"
description = "ASS and SSA subtitle scripts, Matroska packets, override tags, animation, karaoke and drawings as libass reads them"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Development aid: `Renderer::work_spent`, for comparing renderer revisions
# (`cargo xtask ass equivalence`); never needed in production.
work-probe = []

[lints]
workspace = true

[dependencies]
triergon-core = { path = "../core" }
triergon-font = { path = "../font" }
triergon-raster = { path = "../raster" }
triergon-shape = { path = "../shape" }
