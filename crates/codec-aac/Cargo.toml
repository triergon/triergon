[package]
name = "triergon-codec-aac"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Explicit std::simd forms of the SBR QMF banks (requires a nightly toolchain). The same
# operations in the same order as the default code; ARMv7 NEON flushes subnormals to zero.
simd = []

[dependencies]
triergon-bitstream = { path = "../bitstream" }
triergon-codec = { path = "../codec" }

[dev-dependencies]
triergon-codec = { path = "../codec", features = ["reference-trace"] }
triergon-harness-protocol = { path = "../harness-protocol" }

[lints]
workspace = true
