[package]
name = "playback-worker"
version = "0.0.0"
description = "Playback measurement workers: Matroska, HLS, MP4, TS programs, progressive TS188 and raw Annex B operations through the playback engine, and a worker with the Matroska runners alone"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-bridge = { path = "../bridge", features = ["reference-trace"] }
triergon-core = { path = "../core" }
triergon-framing = { path = "../framing" }
triergon-harness-protocol = { path = "../harness-protocol" }
triergon-harness-runner = { path = "../harness-runner" }
triergon-hls = { path = "../hls" }
triergon-isobmff = { path = "../isobmff" }
triergon-matroska = { path = "../matroska" }
triergon-mpegts = { path = "../mpegts" }
triergon-playback = { path = "../playback", features = ["reference-trace"] }
triergon-raw-video = { path = "../raw-video" }
triergon-subtitles = { path = "../subtitles", optional = true }
triergon-worker-entry = { path = "../worker-entry" }

[features]
views = ["dep:triergon-subtitles"]

[[bin]]
name = "playback-views-worker"
path = "src/bin/playback-views-worker/main.rs"
required-features = ["views"]

[lints]
workspace = true
