[package]
name = "triergon-mpegts"
version = "0.0.0"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
triergon-core = { path = "../core" }

[dev-dependencies]
triergon-harness-protocol = { path = "../harness-protocol" }

[features]
# Comparison-only projections the harness compares against the reference; not
# shipped behaviour.
reference-trace = []

[[example]]
name = "mpegts_native_pes_trace"
required-features = ["reference-trace"]

[[example]]
name = "mpegts_source_trace"
required-features = ["reference-trace"]

[[test]]
name = "rejected_carrier"
required-features = ["reference-trace"]

[[test]]
name = "selected_carriage"
required-features = ["reference-trace"]

[[test]]
name = "selected_faults"
required-features = ["reference-trace"]

[[test]]
name = "selected_lifecycle"
required-features = ["reference-trace"]

[lints]
workspace = true
