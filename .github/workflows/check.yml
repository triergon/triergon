name: Workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      # Pinned downloads, kept under their SHA-256 so an upstream outage does not
      # stop the checks. Every entry is verified against its pin before use.
      TRIERGON_DOWNLOAD_CACHE: /home/runner/.cache/triergon-downloads
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # `cargo xtask check-revisions` needs every commit HEAD reaches.
          fetch-depth: 0
      - name: Restore pinned downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /home/runner/.cache/triergon-downloads
          key: pinned-downloads
          restore-keys: pinned-downloads-
      - name: Install check dependencies
        run: |
          packages=(build-essential pkg-config zlib1g-dev nasm rsync zstd)
          retry=(-o Acquire::Retries=1)
          refresh=(-o APT::Update::Error-Mode=any)
          if ! sudo apt-get "${retry[@]}" "${refresh[@]}" update ||
             ! sudo apt-get "${retry[@]}" install -y "${packages[@]}"; then
            # Use the signed Ubuntu archives directly if the runner's mirror is unavailable.
            sources="$RUNNER_TEMP/ubuntu-check.sources"
            cat > "$sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            direct=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-)
            sudo apt-get "${direct[@]}" "${retry[@]}" "${refresh[@]}" update
            sudo apt-get "${direct[@]}" "${retry[@]}" install -y "${packages[@]}"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
          mkdir -p "$TRIERGON_DOWNLOAD_CACHE"
          touch "$RUNNER_TEMP/downloads-start"
      - name: Prepare pinned reference and fixtures
        run: cargo xtask prepare-check || cargo xtask prepare-check
      - name: Verify workspace
        run: cargo xtask check
      - name: Keep only the downloads this run used
        id: downloads
        if: always()
        run: |
          # A run that stopped early may not have reached every download, so only
          # a complete run drops the entries it did not use.
          if [ "${{ job.status }}" = success ]; then
            find "$TRIERGON_DOWNLOAD_CACHE" -type f ! -newer "$RUNNER_TEMP/downloads-start" -delete
          fi
          key=$(ls "$TRIERGON_DOWNLOAD_CACHE" | sort | sha256sum | cut -c1-16)
          echo "key=pinned-downloads-$key" >> "$GITHUB_OUTPUT"
      - name: Save pinned downloads
        if: always() && steps.downloads.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /home/runner/.cache/triergon-downloads
          key: ${{ steps.downloads.outputs.key }}
